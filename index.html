<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>guest@portfolio: ~</title>
<link rel="stylesheet" href="styles.css" />
<script src="app.js" defer></script>
</head>
<body class="crt">
  <div class="screen">
    <div class="stack">
      <header class="site-header">
        <h1 class="site-name">Leniton Carneiro<span class="caret" aria-hidden="true"></span></h1>
        <p class="site-tag">full-stack developer &middot; interactive portfolio</p>
      </header>

      <div class="window">
        <div class="titlebar">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="title">guest@portfolio: ~/&mdash; bash</span>
        </div>

        <div class="terminal" id="log" aria-label="Session log" aria-live="polite"></div>

        <div class="terminal" style="flex:0 0 auto; padding-top:0; border-top:1px solid var(--border);">
          <div class="form-row">
            <span class="prompt">guest@portfolio</span><span class="dim">:</span><span class="path">~</span><span class="dim">$</span>
            <input class="input" id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
          </div>
        </div>

        <div class="tabs" id="tabs" role="tablist" aria-label="Pages"></div>

        <div class="pane" id="pane" role="tabpanel" tabindex="0"></div>
      </div>
    </div>
  </div>
</body>
</html>
