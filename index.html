<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>guest@portfolio: ~</title>
<style>
  :root {
    --bg: #0b0f0b;
    --panel: #111611;
    --border: #233023;
    --green: #33ff66;
    --green-dim: #1f9e42;
    --amber: #ffb454;
    --blue: #59b6ff;
    --red: #ff5f56;
    --yellow: #ffbd2e;
    --text: #c9d6c4;
    --mono: "Cascadia Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #0f1a12 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
  }

  .crt::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: rgba(51, 255, 102, 0.03);
    animation: flicker 6s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .screen {
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    height: 100%;
  }

  .window {
    width: min(900px, 100%);
    height: 100%;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 0 0 1px #000, 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(51, 255, 102, 0.06);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #182018;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: var(--red); }
  .dot.yellow { background: var(--yellow); }
  .dot.green { background: var(--green); }

  .title {
    flex: 1;
    text-align: center;
    color: var(--green-dim);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .terminal {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    line-height: 1.55;
    scrollbar-width: thin;
    scrollbar-color: var(--green-dim) var(--panel);
  }

  .terminal::-webkit-scrollbar { width: 10px; }
  .terminal::-webkit-scrollbar-track { background: var(--panel); }
  .terminal::-webkit-scrollbar-thumb {
    background: var(--green-dim);
    border: 2px solid var(--panel);
    border-radius: 6px;
  }

  .prompt { color: var(--green); }
  .path { color: var(--blue); }
  .cmd { color: #fff; }
  .key { color: var(--amber); }
  .ok { color: var(--green); }
  .dim { color: #5c6b5c; }
  .accent { color: var(--blue); }

  a { color: var(--green); text-decoration: none; border-bottom: 1px dashed var(--green-dim); }
  a:hover { color: #fff; border-bottom-style: solid; }

  .pre { white-space: pre; }

  .prompt-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .prompt-line .out { flex-basis: 100%; }

  .form-row { display: flex; align-items: baseline; gap: 6px; }
  .input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: #fff;
    font: inherit;
    caret-color: transparent;
    padding: 0;
  }

  .hint { margin-top: 10px; color: #4c5a4c; font-size: 13px; }

  @media (max-width: 560px) {
    html, body { font-size: 14px; }
    .screen { padding: 0; }
    .window { border-radius: 0; height: 100%; max-height: 100%; border: 0; }
  }
</style>
</head>
<body class="crt">
  <div class="screen">
    <div class="window">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">guest@portfolio: ~/&mdash; bash</span>
      </div>

      <div class="terminal" id="terminal" aria-live="polite"></div>

      <div class="terminal" style="flex:0 0 auto; padding-top:0; border-top:1px solid var(--border);">
        <div class="form-row">
          <span class="prompt">guest@portfolio</span><span class="dim">:</span><span class="path">~</span><span class="dim">$</span>
          <input class="input" id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
        </div>
      </div>
    </div>
  </div>

<script type="module">
/*
 * ASCII banner is rendered at runtime by figlet (MIT) — vendored, no CDN.
 *   vendor/figlet/figlet.min.mjs  re-export shim
 *   vendor/figlet/figlet-CP8UBLgW.js  renderer
 *   vendor/figlet/Linux.js  FIGfont source for the "Linux" font
 * Edit CONFIG.name below; that is the only per-deploy change needed.
 */
const USER = "guest";
const HOST = "portfolio";

const CONFIG = {
  name: "LENITON\nCARNEIRO",
  font: "Linux",
  width: 76,
};

const FALLBACK_BANNER = `.-.   .---..-..-..-..---..----..-..-.
| |__ | |- | .\` || |\`| |'| || || .\` |
\`----'\`---'\`-'\`-'\`-' \`-' \`----'\`-'\`-'

.---..---..---. .-..-..---..-..---. .----.
| |  | | || |-< | .\` || |- | || |-< | || |
\`---'\`^-'\`-'\`-'\`-' \`---\`-'\`-'\`-' \`----'

`;

const BOOT = [
  { type: "dim", text: `Last login: ${new Date().toString().slice(0, 24)} on ttys001` },
  { type: "dim", text: "" },
  { type: "banner" },
  { type: "dim", text: "" },
  { type: "out", html: `<span class="dim">Interactive portfolio shell v1.0.0 &mdash; type </span><span class="key">help</span><span class="dim"> and hit Enter.</span>` },
];

const FILES = {
  about: [
    `<span class="accent">Hi, I'm</span> <span class="ok">Your Name</span> &mdash; a full-stack developer.`,
    ``,
    `I build fast, accessible things for the web. Five years of shipping`,
    `production apps, tooling, and open source. Currently focused on`,
    `<span class="accent">developer experience</span> and <span class="accent">performance</span>.`,
    ``,
    `<span class="dim">Based in</span>  Remote / UTC+1`,
    `<span class="dim">Focus</span>     TypeScript, Go, Rust, Postgres`,
    `<span class="dim">Status</span>    <span class="ok">available for freelance &amp; open source</span>`,
  ],
  skills: [
    `<span class="accent">Languages</span>`,
    `  TypeScript  <span class="ok">[####################]</span> 98%`,
    `  Go          <span class="ok">[#################  ]</span> 88%`,
    `  Rust        <span class="ok">[##############    ]</span> 70%`,
    `  Python      <span class="ok">[##########        ]</span> 50%`,
    ``,
    `<span class="accent">Frameworks</span>`,
    `  React, Next.js, Svelte, Node, Tauri, Postgres, Docker, Nix`,
    ``,
    `<span class="accent">Tools</span>`,
    `  git, neovim, tmux, GitHub Actions, Terraform, Figma`,
  ],
  projects: [
    `<span class="accent">~/projects</span>`,
    ``,
    `  <span class="ok">drwxr-xr-x</span>  <span class="accent">dotfiles</span>          nix + tmux + neovim setup`,
    `  <span class="ok">drwxr-xr-x</span>  <span class="accent">termui</span>            terminal UI kit (TypeScript)`,
    `  <span class="ok">drwxr-xr-x</span>  <span class="accent">api-gateway</span>       Go, ~1.2M req/day`,
    `  <span class="ok">drwxr-xr-x</span>  <span class="accent">tiny-search</span>       from-scratch search index`,
    ``,
    `  <span class="dim">hint:</span> try <span class="key">projects 1</span> for details`,
  ],
  contact: [
    `  Email    <a href="mailto:you@example.com">you@example.com</a>`,
    `  GitHub   <a href="https://github.com/" target="_blank" rel="noopener">github.com/yourhandle</a>`,
    `  LinkedIn <a href="https://www.linkedin.com/" target="_blank" rel="noopener">linkedin.com/in/yourhandle</a>`,
    `  Site     <a href="https://example.com" target="_blank" rel="noopener">example.com</a>`,
  ],
  whoami: [`<span class="ok">${USER}</span> &mdash; visitor #<span id="hits"></span> since boot`],
};

const HELP = [
  `<span class="key">help</span>        show this list`,
  `<span class="key">about</span>       who I am`,
  `<span class="key">skills</span>      technical skill bars`,
  `<span class="key">projects</span>    project listing (try: projects 1)`,
  `<span class="key">contact</span>     links and email`,
  `<span class="key">banner &lt;text&gt;</span> render text in the Linux figlet font`,
  `<span class="key">whoami</span>      current session user`,
  `<span class="key">date</span>        current date and time`,
  `<span class="key">echo &lt;text&gt;</span>  print text`,
  `<span class="key">clear</span>       clear the terminal`,
  ``,
  `<span class="dim">tip: use the up/down arrows for command history.</span>`,
];

const PROJECTS = {
  "1": [
    `<span class="accent">dotfiles</span> &mdash; reproducible dev environment`,
    ``,
    `  Nix flake + Home Manager managing tmux, neovim, zsh and every`,
    `  CLI tool. One command on a fresh machine, identical setup.`,
    ``,
    `  <span class="dim">nix</span> <span class="dim">·</span> <span class="dim">home-manager</span> <span class="dim">·</span> <span class="dim">tmux</span> <span class="dim">·</span> <span class="dim">neovim</span>`,
  ],
  "2": [
    `<span class="accent">termui</span> &mdash; a tiny terminal UI kit`,
    ``,
    `  Composable components (lists, tables, prompts) that render to any`,
    `  TTY. Zero runtime dependencies, 14kB minified, 100% typed.`,
    ``,
    `  <span class="dim">typescript</span> <span class="dim">·</span> <span class="dim">ansi</span> <span class="dim">·</span> <span class="dim">zero-deps</span>`,
  ],
  "3": [
    `<span class="accent">api-gateway</span> &mdash; Go request router`,
    ``,
    `  Reverse proxy with rate limiting, circuit breaking and structured`,
    `  logging. Handles ~1.2M requests/day at p99 under 4ms.`,
    ``,
    `  <span class="dim">go</span> <span class="dim">·</span> <span class="dim">redis</span> <span class="dim">·</span> <span class="dim">opentelemetry</span>`,
  ],
};

const term = document.getElementById("terminal");
const input = document.getElementById("cmd");
const history = [];
let histIndex = -1;

let figlet = null;

async function loadFiglet() {
  try {
    const [mod, fontMod] = await Promise.all([
      import("./vendor/figlet/figlet.min.mjs"),
      import("./vendor/figlet/Linux.js"),
    ]);
    mod.default.parseFont(CONFIG.font, fontMod.default, true);
    figlet = mod.default;
  } catch (err) {
    console.warn("figlet unavailable, using fallback banner:", err);
  }
}

function bannerArt(text) {
  const opts = { font: CONFIG.font };
  if (!text.includes("\n")) opts.width = CONFIG.width;
  return figlet.textSync(text.toUpperCase(), opts);
}

function bannerHTML(text) {
  let art;
  try {
    art = figlet ? bannerArt(text) : FALLBACK_BANNER;
  } catch (err) {
    console.warn("banner render failed:", err);
    art = FALLBACK_BANNER;
  }
  return art
    .replace(/\s+$/, "")
    .split("\n")
    .map((l) => `<span class="ok">${esc(l)}</span>`)
    .join("\n");
}

const esc = (s) =>
  s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function promptHTML(text) {
  return `<span class="prompt">${USER}@${HOST}</span><span class="dim">:</span><span class="path">~</span><span class="dim">$</span> <span class="cmd">${esc(text)}</span>`;
}

function write(html, cls = "") {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = html;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

function run(line) {
  write(promptHTML(line), "prompt-line");

  const [name, ...args] = line.trim().split(/\s+/);
  const cmd = (name || "").toLowerCase();
  const arg = args.join(" ");

  const out = [];
  switch (cmd) {
    case "":
      break;
    case "help":
    case "?":
      out.push(...HELP);
      break;
    case "about":
    case "bio":
      out.push(...FILES.about);
      break;
    case "skills":
      out.push(...FILES.skills);
      break;
    case "projects":
    case "ls":
      if (arg && !PROJECTS[arg]) {
        out.push(`<span class="dim">projects:</span> no such project: ${esc(arg)} <span class="dim">(try 1, 2 or 3)</span>`);
      } else {
        out.push(...(arg ? PROJECTS[arg] : FILES.projects));
      }
      break;
    case "contact":
      out.push(...FILES.contact);
      break;
    case "banner":
    case "figlet":
      if (!arg) {
        out.push(`<span class="dim">usage: banner &lt;text&gt;</span>`);
      } else if (!figlet) {
        out.push(`<span class="dim">banner: figlet failed to load</span>`);
      } else {
        write(bannerHTML(arg), "pre");
      }
      break;
    case "whoami":
      out.push(...FILES.whoami);
      break;
    case "date":
      out.push(`<span class="dim">${new Date().toString()}</span>`);
      break;
    case "echo":
      out.push(esc(arg));
      break;
    case "clear":
    case "reset":
      term.innerHTML = "";
      return;
    case "sudo":
      out.push(`<span class="dim">${USER} is not in the sudoers file. This incident has been reported.</span>`);
      break;
    case "exit":
      out.push(`<span class="dim">logout</span>`);
      break;
    case "cat":
      out.push(arg && FILES[arg.toLowerCase()]
        ? FILES[arg.toLowerCase()].join("\n").replace(/<[^>]+>/g, (m) => m)
        : `<span class="dim">cat: ${esc(arg || "")}: No such file or directory</span>`);
      break;
    default:
      out.push(`<span class="dim">${esc(cmd)}: command not found. Type </span><span class="key">help</span><span class="dim">.</span>`);
  }

  out.forEach((l) => write(l === "" ? "&nbsp;" : l));
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const line = input.value;
    run(line);
    if (line.trim()) {
      history.push(line);
      histIndex = history.length;
    }
    input.value = "";
  } else if (e.key === "ArrowUp") {
    if (!history.length) return;
    histIndex = Math.max(0, histIndex - 1);
    input.value = history[histIndex] ?? "";
    e.preventDefault();
  } else if (e.key === "ArrowDown") {
    if (!history.length) return;
    histIndex = Math.min(history.length, histIndex + 1);
    input.value = history[histIndex] ?? "";
    e.preventDefault();
  } else if (e.key === "l" && e.ctrlKey) {
    term.innerHTML = "";
    e.preventDefault();
  }
});

term.addEventListener("click", () => input.focus());

(async function boot() {
  await loadFiglet();
  for (const line of BOOT) {
    if (line.type === "banner") {
      write(bannerHTML(CONFIG.name), "pre");
    } else {
      write(line.html ?? esc(line.text), line.type === "out" ? "" : "dim");
    }
    await new Promise((r) => setTimeout(r, 110));
  }
  run("help");
  const hits = document.getElementById("hits");
  if (hits) hits.textContent = "0001";
  term.scrollTop = term.scrollHeight;
  input.focus();
})();
</script>
</body>
</html>
