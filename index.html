<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leniton Carneiro | Webpage</title>
<link rel="stylesheet" href="styles.css" />
<script src="app.js" defer></script>
</head>
<body class="crt">
  <div class="screen">
    <div class="stack">
      <header class="site-header">
        <h1 class="site-name">Leniton Carneiro<span class="caret" aria-hidden="true"></span></h1>
        <p class="site-tag">Game developer &middot; portfolio</p>
      </header>

      <div class="window">
        <div class="titlebar">
          <span class="tb-icon" aria-hidden="true">&gt;_</span>
          <span class="title">leniton@portfolio: ~&mdash; bash</span>
          <span class="tb-controls" aria-hidden="true">
            <span class="tb-btn">&minus;</span>
            <span class="tb-btn">&#9633;</span>
            <span class="tb-btn">&times;</span>
          </span>
        </div>

        <div class="terminal" id="log" aria-label="Session log" aria-live="polite"></div>

        <div class="cmdline">
          <form class="form-row" id="cmdform">
            <label class="prompt" for="cmd">leniton@portfolio<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></label>
            <div class="input-row">
              <input class="input" id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" />
              <button class="run" type="submit">run</button>
            </div>
          </form>
        </div>

        <div class="tabs" id="tabs" role="tablist" aria-label="Pages"></div>

        <div class="pane" id="pane" role="tabpanel" tabindex="0"></div>
      </div>
    </div>
  </div>
</body>
</html>
